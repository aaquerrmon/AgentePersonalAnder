[project]
name = "agente-personal"
version = "0.1.0"
description = "Agente personal: ingesta RAG (docling + embeddings en CPU + PostgreSQL) y código compartido"
requires-python = ">=3.12,<4"
dependencies = [
    "psycopg[binary,pool]==3.3.8",
    "pgvector>=0.3.6,<1",
    "mcp>=2.3.0",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.uv]
# Proyecto virtual: solo scripts, no hay paquete que construir
package = false

[project.optional-dependencies]
ingest = [
    "docling>=2.150.0",
    "transformers>=4.40,<6",
    "torch>=2.2.2,<3",
    "torchvision>=0.20,<1",
]
mcp = ["requests>=2.31,<3", "python-dotenv>=1,<2"]
agent = [
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<3",
    "langgraph-checkpoint-postgres>=3,<4",
    "python-telegram-bot>=21,<27",
    "python-dotenv>=1,<2",
]
