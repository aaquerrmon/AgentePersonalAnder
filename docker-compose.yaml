services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    container_name: postgres-vector
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-net

  # Servidor de embeddings con vLLM: intfloat/multilingual-e5-small (384 dims)
  # Expone la API compatible con OpenAI en /v1/embeddings
  embedding:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.33.0}
    container_name: vllm-embedding
    restart: unless-stopped
    command:
      - intfloat/multilingual-e5-small
      - --served-model-name=${EMBEDDINGS_MODEL:-multilingual-e5-small}
      - --runner=pooling
      - --max-model-len=512
      - --dtype=bfloat16
      - --gpu-memory-utilization=0.30
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "${EMBEDDINGS_PORT:-8000}:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - agent-net

  # Ingesta one-shot: convierte los ficheros de ./docs con docling, los trocea
  # con HybridChunker y los inserta (idempotente por sha256) en documentos_rag
  # y chunks_rag. Se ejecuta en cada `docker compose up`.
  ingest:
    build: ./ingest
    container_name: rag-ingest
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DOCS_DIR: /docs
      EMBEDDINGS_BASE_URL: http://embedding:8000/v1
    volumes:
      - ./docs:/docs:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - agent-net

volumes:
  postgres_data:
  pgadmin_data:
  hf_cache:

networks:
  agent-net:
    driver: bridge
