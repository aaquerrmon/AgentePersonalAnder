services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    container_name: postgres-vector
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-net

  # Servidor LLM con vLLM: Qwen3-4B-AWQ, API compatible con OpenAI en /v1/chat/completions
  llm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.33.0}
    container_name: vllm-llm
    restart: unless-stopped
    command:
      - ${LLM_MODEL:-Qwen/Qwen3-4B-AWQ}
      - --served-model-name=${LLM_SERVED_MODEL_NAME:-local-llm}
      - --host=0.0.0.0
      - --port=8080
      - --gpu-memory-utilization=${LLM_GPU_MEMORY_UTILIZATION:-0.62}
      - --max-model-len=${LLM_MAX_MODEL_LEN:-4096}
      - --max-num-seqs=2
      - --quantization=awq_marlin
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --reasoning-parser=qwen3
    ports:
      # Solo loopback: el LLM no se expone en la LAN
      - "127.0.0.1:${LLM_PORT:-8080}:8080"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_LOGGING_LEVEL: INFO
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 200s
    networks:
      - agent-net

  # Servidor de embeddings con vLLM: intfloat/multilingual-e5-small (384 dims)
  # Expone la API compatible con OpenAI en /v1/embeddings
  embedding:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.33.0}
    container_name: vllm-embedding
    restart: unless-stopped
    command:
      - intfloat/multilingual-e5-small
      - --served-model-name=${EMBEDDINGS_MODEL:-multilingual-e5-small}
      - --runner=pooling
      - --max-model-len=512
      - --dtype=bfloat16
      - --gpu-memory-utilization=0.1
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "${EMBEDDINGS_PORT:-8000}:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - agent-net

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: rag-ingest
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DOCS_DIR: /docs
      EMBEDDINGS_BASE_URL: http://embedding:8000/v1
    volumes:
      - ./docs:/docs:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - agent-net

  # Servidor MCP (consulta SQL de solo lectura + búsqueda semántica RAG).
  # Transporte streamable-http: el cliente MCP se conecta a http://localhost:8001/mcp
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: rag-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      EMBEDDINGS_BASE_URL: http://embedding:8000/v1
      MCP_TRANSPORT: streamable-http
      # Puerto interno del servidor: el MCP_PORT de .env es el mapeado en el host
      MCP_PORT: 8001
    ports:
      - "${MCP_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - agent-net
  

  agent:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: telegram-agent
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      MCP_URL: http://mcp:8001/mcp
      POSTGRES_HOST: postgres
      # vLLM en lugar de OpenAI (el .env apunta a api.openai.com por defecto)
      OPENAI_BASE_URL: http://llm:8080/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-local}
      LLM_MODEL: ${LLM_SERVED_MODEL_NAME:-local-llm}

    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_healthy
      mcp:
        condition: service_started

    networks:
      - agent-net


volumes:
  postgres_data:
  pgadmin_data:
  hf_cache:

networks:
  agent-net:
    driver: bridge
